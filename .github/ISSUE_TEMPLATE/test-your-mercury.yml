name: Test your Mercury / Add your ECU
description: Submit a short CraftBridge compatibility test report for maintainer review.
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing CraftBridge. Reports are reviewed before any result is added to the maintainer-curated compatibility list.
        Do not include engine serial numbers, credentials, private paths, or other private identifiers.

  - type: input
    id: engine_model
    attributes:
      label: Mercury engine model
      placeholder: Example: Mercury 40 EFI FourStroke
    validations:
      required: true

  - type: input
    id: model_year
    attributes:
      label: Model year
      placeholder: Exact or approximate model year
    validations:
      required: true

  - type: input
    id: ecu
    attributes:
      label: ECU family or part number
      description: Provide this only if known. Do not provide the engine serial number.
      placeholder: Example: ECM-555/PCM-555 family

  - type: input
    id: craftbridge_version
    attributes:
      label: CraftBridge variant and version
      placeholder: Example: Option 3A Motor Node A/Web v1.0.0
    validations:
      required: true

  - type: textarea
    id: working_values
    attributes:
      label: Working engine values
      description: List the values that produced current and plausible readings, and identify any values that did not.
      placeholder: RPM, engine temperature, engine runtime, oil pressure, battery voltage, fuel flow
    validations:
      required: true

  - type: textarea
    id: session_result
    attributes:
      label: Session/startup result
      description: If available, describe startup/session state, S0/S3 result, and whether application TX remained disabled after startup.

  - type: input
    id: can_counters
    attributes:
      label: CAN missed / overrun / bus
      description: If available, enter the three diagnostics counters.
      placeholder: Example: 0 / 0 / 0

  - type: dropdown
    id: overall_result
    attributes:
      label: Overall result
      options:
        - PASS
        - FAIL
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Comments and relevant evidence
      description: Add concise observations and links or attachments that support the result. Remove private identifiers before submitting.