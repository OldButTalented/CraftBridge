name: Test your Mercury / Add your ECU
description: Submit a concise CraftBridge compatibility test report for maintainer review.
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing CraftBridge. Reports are reviewed before any result is added to the maintainer-curated compatibility list.
        Do not include engine serial numbers, credentials, private paths, proprietary files, or other private identifiers.

  - type: input
    id: engine_model
    attributes:
      label: Mercury engine model
      placeholder: Example: Mercury 40 EFI FourStroke
    validations:
      required: true

  - type: input
    id: model_year
    attributes:
      label: Model year
      placeholder: Exact or approximate model year
    validations:
      required: true

  - type: input
    id: ecu
    attributes:
      label: ECU / ECM family or part number
      description: Provide this only if known. Do not provide the engine serial number.
      placeholder: Example: ECM-555/PCM-555 family

  - type: input
    id: craftbridge_version
    attributes:
      label: CraftBridge version
      placeholder: Example: Motor Node Web v2.0.0
    validations:
      required: true

  - type: textarea
    id: smartcraft_setup
    attributes:
      label: SmartCraft presence and setup
      description: Describe the installed SmartCraft equipment or isolated bench setup.
    validations:
      required: true

  - type: textarea
    id: topology
    attributes:
      label: Test topology and interface hardware
      description: Describe the connections and identify the CAN interface, transceiver or capture hardware used.
    validations:
      required: true

  - type: input
    id: can_bitrate
    attributes:
      label: CAN bitrate
      description: Enter the bitrate if known.
      placeholder: Example: 250 kbit/s

  - type: textarea
    id: test_conditions
    attributes:
      label: Test conditions
      description: State whether the engine was stopped, running or tested in both states, and describe relevant ignition/startup conditions.
    validations:
      required: true

  - type: input
    id: repetitions
    attributes:
      label: Number of test runs
      placeholder: Example: 3
    validations:
      required: true

  - type: textarea
    id: observed_result
    attributes:
      label: Observed result and working engine values
      description: Describe startup/session behavior and list values that worked or failed.
      placeholder: RPM, engine temperature, runtime, oil pressure, battery voltage, fuel flow
    validations:
      required: true

  - type: input
    id: can_counters
    attributes:
      label: CAN missed / overrun / bus
      description: If available, enter the three diagnostics counters.
      placeholder: Example: 0 / 0 / 0

  - type: dropdown
    id: overall_result
    attributes:
      label: Overall result
      options:
        - PASS
        - FAIL
    validations:
      required: true

  - type: dropdown
    id: evidence_availability
    attributes:
      label: Raw evidence or log availability
      options:
        - Attached or linked
        - Available on request
        - Not available
    validations:
      required: true

  - type: textarea
    id: comments
    attributes:
      label: Comments and relevant evidence
      description: Add concise observations and links or attachments. Remove private identifiers before submitting.

  - type: checkboxes
    id: submission_rights
    attributes:
      label: Submission confirmation
      options:
        - label: I confirm that the submitted data contains no private or proprietary material and that I have the right to share it.
          required: true