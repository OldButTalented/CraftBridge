[platformio]
default_envs = engine-node-s3-n16r8
src_dir = firmware/CraftBridge_Motor_Node_Web_v1_0_0

[env]
platform = espressif32@6.10.0
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; ESP32-S3 N16R8 configuration shared with the documented Arduino IDE build.
[env:engine-node-s3-n16r8]
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = firmware/CraftBridge_Motor_Node_Web_v1_0_0/partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -Wall -Wextra -Werror
build_src_filter = +<SmartCraftSession.cpp> +<EngineData.cpp> +<RuntimeMetrics.cpp> +<WebInterface.cpp>
test_build_src = yes
